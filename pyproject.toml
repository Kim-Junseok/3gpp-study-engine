[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "3gpp-study-engine"
version = "0.13.1"
description = "Provenance-bound propositions and explicit researcher relations for 3GPP study material"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "pytz>=2024,<2027",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "xlwt>=1.3,<2"]
web = ["fastapi>=0.115,<0.130", "uvicorn>=0.32,<1", "Jinja2>=3.1,<4", "python-multipart>=0.0.18,<1"]
web-test = ["playwright>=1.49,<2"]

[project.scripts]
threegpp = "threegpp.cli:main"
threegpp-web = "threegpp_web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threegpp", "src/threegpp_web"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: tests requiring live public 3GPP access"]
