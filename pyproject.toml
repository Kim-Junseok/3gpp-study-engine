[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "3gpp-study-engine"
version = "0.2.0a3"
description = "Provenance-first metadata ingestion for public 3GPP meeting resources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "pytz>=2024,<2027",
  "PyYAML>=6,<7",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "xlwt>=1.3,<2"]

[project.scripts]
threegpp = "threegpp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threegpp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: tests requiring live public 3GPP access"]
